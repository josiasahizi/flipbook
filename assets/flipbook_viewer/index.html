<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lecteur de flipbook</title>

  <!-- StPageFlip est injecté par Flutter depuis le bundle local corrigé. -->
  <style>%%PAGE_FLIP_CSS%%</style>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      touch-action: none; /* on gère nous-mêmes le pincement, voir le script */
    }
    #zoom-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      transform-origin: center center;
    }
    #book {
      margin: 0 auto;
      max-width: 100%;
      max-height: 100%;
    }
    /* Les images de page s'affichent ENTIÈRES, sans être rognées — même si
       leurs proportions ne correspondent pas exactement au cadre de la
       page (ex: PDF avec des marges différentes). Sans ça, StPageFlip
       recadrait les pages par défaut, coupant du texte en bas. */
    .stf__item img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #ffffff;
    }
    #zoom-overlay {
      position: absolute;
      display: none;
      z-index: 25;
      overflow: hidden;
      pointer-events: none;
      background: #ffffff;
    }
    #zoom-overlay.visible {
      display: flex;
    }
    #zoom-overlay img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      flex: 1 1 0;
    }
    /* Reliure centrale de la couche nette affichée pendant le zoom. */
    #zoom-overlay.has-spread::after {
      content: '';
      position: absolute;
      z-index: 30;
      top: 0;
      left: 50%;
      width: 56px;
      height: 100%;
      transform: translateX(-50%);
      pointer-events: none;
      background: linear-gradient(
        to right,
        rgba(0, 0, 0, 0),
        rgba(0, 0, 0, 0.16) 42%,
        rgba(0, 0, 0, 0.26) 50%,
        rgba(255, 255, 255, 0.16) 58%,
        rgba(255, 255, 255, 0)
      );
    }
    /* Petit indicateur affiché tant qu'aucune page n'est chargée */
    #placeholder {
      color: #888;
      font-family: sans-serif;
      text-align: center;
      padding-top: 40vh;
    }
  </style>
</head>
<body>
  <div id="placeholder">Chargement du flipbook...</div>
  <div id="zoom-wrapper">
    <div id="book" class="stf__parent" style="display:none;"></div>
  </div>

  <script>
    %%PAGE_FLIP_JS%%
  </script>
  <script>
    // La liste des URLs de pages est injectée directement ici par Flutter
    // (remplacement de texte), pour éviter toute dépendance à runJavaScript
    // ou setJavaScriptMode, qui ne sont pas supportés de façon fiable sur
    // toutes les plateformes (notamment Flutter Web).
    const pageUrls = %%PAGES_JSON%%;

    document.getElementById('placeholder').style.display = 'none';
    const bookEl = document.getElementById('book');
    bookEl.style.display = 'block';

    const pageFlip = new St.PageFlip(bookEl, {
      // Dimensions internes plus élevées que la taille d'affichage réelle :
      // c'est ce qui donne des pages nettes sur écrans haute densité
      // (Retina...), même en mode Canvas — pas besoin du mode HTML pour ça.
      // Résolution interne élevée pour conserver une image nette pendant
      // le zoom. Le canvas est ensuite réduit à la taille de l'écran.
      width: 2400,
      height: 3394,
      size: 'stretch',
      // Les petites valeurs permettent au moteur de s'adapter aux téléphones
      // étroits au lieu de dépasser de la fenêtre.
      minWidth: 1,
      maxWidth: 2400,
      minHeight: 1,
      maxHeight: 3394,
      showCover: false,
      maxShadowOpacity: 0.5,
      // Animation plus lente pour éviter l'effet de changement brusque.
      flippingTime: 900,
      mobileScrollSupport: false,
      usePortrait: true, // passe automatiquement en page unique sur petit écran
      clickEventForward: true,
      // Le changement de page se fera par glissement ou double-clic,
      // jamais par un clic simple.
      disableFlipByClick: true,
    });

    // Le Canvas est conservé à taille normale pour garder l'animation
    // incurvée de PageFlip. Une couche HTML nette est utilisée uniquement
    // pendant le zoom (voir showZoomOverlay()).
    pageFlip.loadFromImages(pageUrls);

    // ---------- Pont avec Flutter (signets, miniatures) ----------
    // Flutter appelle ces fonctions via runJavaScript() pour lire/changer la
    // page courante (voir FlipbookPageView.getCurrentPage()/goToPage()), et
    // écoute le canal FlipbookChannel pour être notifié à chaque changement
    // de page (utile pour mettre à jour l'icône de signet et surligner la
    // page courante dans la grille de miniatures).
    window.flipbookGetCurrentPage = function () {
      return pageFlip.getCurrentPageIndex() + 1; // 1-based côté Flutter
    };

    window.flipbookGoToPage = function (page) {
      const index = Math.max(0, Math.min(pageFlip.getPageCount() - 1, page - 1));
      pageFlip.flip(index);
    };

    function notifyFlutterPageChanged() {
      if (window.FlipbookChannel && window.FlipbookChannel.postMessage) {
        window.FlipbookChannel.postMessage(JSON.stringify({
          type: 'pageChanged',
          page: pageFlip.getCurrentPageIndex() + 1,
          total: pageFlip.getPageCount(),
        }));
      }
    }
    pageFlip.on('flip', notifyFlutterPageChanged);
    notifyFlutterPageChanged();

    let currentScale = 1;
    let panX = 0;
    let panY = 0;
    let panStartX = 0;
    let panStartY = 0;
    let panOriginX = 0;
    let panOriginY = 0;
    let didPan = false;
    let tapStartX = 0;
    let tapStartY = 0;
    let tapMoved = false;
    let lastPageTapTime = 0;
    let lastPageTapSide = null; // 'left' | 'right' | null
    window.flipbookZoomScale = currentScale;

    function applyZoomResolution() {
      window.flipbookZoomScale = currentScale;
      window.flipbookNavigationLocked = currentScale > MIN_SCALE;
      pageFlip.update();
      const canvas = bookEl.querySelector('canvas');
      const context = canvas && canvas.getContext('2d');
      if (context) {
        context.imageSmoothingEnabled = true;
        context.imageSmoothingQuality = 'high';
      }
    }

    function applyTransform() {
      zoomWrapper.style.transform =
        'translate(' + panX + 'px, ' + panY + 'px) scale(' + currentScale + ')';
    }

    function constrainPan() {
      const maxX = Math.max(0, (zoomWrapper.clientWidth * currentScale - zoomWrapper.clientWidth) / 2);
      const maxY = Math.max(0, (zoomWrapper.clientHeight * currentScale - zoomWrapper.clientHeight) / 2);
      panX = Math.min(maxX, Math.max(-maxX, panX));
      panY = Math.min(maxY, Math.max(-maxY, panY));
    }

    // Le layout du WebView peut nécessiter plusieurs frames après l'ouverture
    // ou une rotation. On attend donc que la taille CSS soit stabilisée avant
    // de dimensionner le canvas, sinon il devient flou jusqu'à la rotation
    // suivante.
    let resizeFrame = 0;
    function configureCanvasQuality() {
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          const canvas = bookEl.querySelector('canvas');
          const context = canvas && canvas.getContext('2d');
          if (!context) return;

          const cssWidth = canvas.clientWidth;
          const cssHeight = canvas.clientHeight;
          if (cssWidth <= 0 || cssHeight <= 0) {
            return;
          }

          pageFlip.update();
        });
      });
    }
    configureCanvasQuality();
    new ResizeObserver(configureCanvasQuality).observe(bookEl);
    window.addEventListener('resize', configureCanvasQuality);
    window.addEventListener('orientationchange', configureCanvasQuality);

    // ---------- Pincement à deux doigts pour zoomer ----------
    // Géré ici en JavaScript pur plutôt que côté Flutter, car StPageFlip
    // capture déjà les gestes tactiles à un doigt pour le glissement de
    // page — un zoom géré côté Flutter (InteractiveViewer) entre en
    // conflit avec ça. En le faisant ici, les deux gestes cohabitent bien :
    // un doigt = tourne la page (StPageFlip), deux doigts = zoome (ici).
    const zoomWrapper = document.getElementById('zoom-wrapper');
    const zoomOverlay = document.createElement('div');
    zoomOverlay.id = 'zoom-overlay';
    zoomWrapper.appendChild(zoomOverlay);
    let zoomOverlayVisible = false;

    function updateZoomOverlay() {
      const page = pageFlip.getCurrentPageIndex();
      const landscape = pageFlip.getOrientation() === 'landscape';
      const urls = landscape ? pageUrls.slice(page, page + 2) : pageUrls.slice(page, page + 1);
      zoomOverlay.innerHTML = '';
      urls.forEach((url) => {
        const image = document.createElement('img');
        image.src = url;
        image.alt = '';
        zoomOverlay.appendChild(image);
      });
      zoomOverlay.classList.toggle('has-spread', urls.length > 1);
      // On utilise les dimensions de mise en page (offsetLeft/Width...),
      // insensibles au transform CSS scale/translate du parent, plutôt que
      // getBoundingClientRect() — sinon, si cette fonction est appelée
      // pendant qu'un zoom est déjà actif (ex: un second pincement sans
      // avoir dézoomé entre-temps), on récupère des coordonnées déjà mises
      // à l'échelle, puis le transform du parent s'applique une seconde
      // fois par-dessus : la couche blanche explose et recouvre tout
      // l'écran, faisant disparaître le fond noir.
      zoomOverlay.style.left = bookEl.offsetLeft + 'px';
      zoomOverlay.style.top = bookEl.offsetTop + 'px';
      zoomOverlay.style.width = bookEl.offsetWidth + 'px';
      zoomOverlay.style.height = bookEl.offsetHeight + 'px';
    }

    function showZoomOverlay() {
      if (!zoomOverlayVisible) {
        updateZoomOverlay();
        zoomOverlay.classList.add('visible');
        zoomOverlayVisible = true;
      }
    }

    function hideZoomOverlay() {
      zoomOverlay.classList.remove('visible');
      zoomOverlayVisible = false;
    }
    pageFlip.on('flip', updateZoomOverlay);
    let initialDistance = 0;
    let initialScale = 1;
    const MIN_SCALE = 1;
    const MAX_SCALE = 3;

    function distanceBetween(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    document.addEventListener('touchstart', function (event) {
      if (event.touches.length === 2) {
        window.flipbookZooming = true;
        event.stopPropagation();
        showZoomOverlay();
        initialDistance = distanceBetween(event.touches);
        initialScale = currentScale;
      } else if (event.touches.length === 1 && window.flipbookNavigationLocked) {
        event.stopPropagation();
        event.preventDefault();
        panStartX = event.touches[0].clientX;
        panStartY = event.touches[0].clientY;
        panOriginX = panX;
        panOriginY = panY;
        didPan = false;
      } else if (event.touches.length === 1 && currentScale === 1) {
        // Un doigt, pas de zoom en cours : on trace juste le point de
        // départ pour distinguer un tap (double-tap = tourner la page)
        // d'un glissement (laissé à StPageFlip, qui gère déjà le swipe).
        tapStartX = event.touches[0].clientX;
        tapStartY = event.touches[0].clientY;
        tapMoved = false;
      } else if (window.flipbookNavigationLocked) {
        event.stopPropagation();
      }
    }, { capture: true, passive: true });

    document.addEventListener('touchmove', function (event) {
      if (event.touches.length === 2) {
        window.flipbookZooming = true;
        event.stopPropagation();
        event.preventDefault();
        const newDistance = distanceBetween(event.touches);
        const rawScale = initialScale * (newDistance / initialDistance);
        currentScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, rawScale));
        applyZoomResolution();
        constrainPan();
        applyTransform();
      } else if (event.touches.length === 1 && window.flipbookNavigationLocked) {
        event.stopPropagation();
        event.preventDefault();
        panX = panOriginX + event.touches[0].clientX - panStartX;
        panY = panOriginY + event.touches[0].clientY - panStartY;
        didPan = didPan ||
          Math.abs(event.touches[0].clientX - panStartX) > 5 ||
          Math.abs(event.touches[0].clientY - panStartY) > 5;
        constrainPan();
        applyTransform();
      } else if (event.touches.length === 1 && currentScale === 1) {
        if (Math.abs(event.touches[0].clientX - tapStartX) > 10 ||
          Math.abs(event.touches[0].clientY - tapStartY) > 10) {
          tapMoved = true;
        }
      }
    }, { capture: true, passive: false });

    // Double-tap : double-tap sur la moitié GAUCHE du livre revient à la
    // page précédente, double-tap sur la moitié DROITE avance à la page
    // suivante. Un simple tap ne fait rien (flip par clic désactivé, voir
    // disableFlipByClick ci-dessus) ; le glissement (swipe) continue lui
    // aussi de tourner les pages, géré nativement par StPageFlip.
    //
    // Note : on ne peut PAS utiliser l'événement `click` ici — StPageFlip
    // appelle preventDefault() sur touchstart (mobileScrollSupport: false),
    // ce qui empêche le navigateur de synthétiser un `click` sur mobile.
    // D'où la détection via `touchend`, regroupée avec celle du zoom.
    let lastZoomTap = 0;
    document.addEventListener('touchend', function (event) {
      if (event.touches.length === 0) {
        const now = Date.now();
        if (!didPan && currentScale > 1 && now - lastZoomTap < 300) {
          currentScale = 1;
          panX = 0;
          panY = 0;
          hideZoomOverlay();
          applyZoomResolution();
          applyTransform();
          lastZoomTap = 0;
        } else if (!didPan && currentScale > 1) {
          lastZoomTap = now;
        } else if (currentScale === 1 && !tapMoved && pageFlip.getState() !== 'flipping') {
          const touch = event.changedTouches[0];
          const rect = bookEl.getBoundingClientRect();
          const insideBook = !!touch &&
            touch.clientX >= rect.left && touch.clientX <= rect.right &&
            touch.clientY >= rect.top && touch.clientY <= rect.bottom;
          if (insideBook) {
            const side = touch.clientX < rect.left + rect.width / 2 ? 'left' : 'right';
            if (side === lastPageTapSide && now - lastPageTapTime < 300) {
              if (side === 'left') {
                pageFlip.flipPrev('top');
              } else {
                pageFlip.flipNext('top');
              }
              lastPageTapTime = 0;
              lastPageTapSide = null;
            } else {
              lastPageTapTime = now;
              lastPageTapSide = side;
            }
          }
          lastZoomTap = 0;
        } else {
          lastZoomTap = 0;
        }
        didPan = false;
        tapMoved = false;
        setTimeout(function () {
          window.flipbookZooming = false;
        }, 0);
      }
    }, { capture: true });
  </script>
</body>
</html>
